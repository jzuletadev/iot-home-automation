# Paquete base compartido por todos los nodos.
#
# No se flashea solo: cada archivo de nodo en la raiz lo incluye con:
#
#   substitutions:
#     node_name: "bedroom"
#     friendly_name: "Bedroom"
#   packages:
#     base: !include common/base.yaml
#
# Las substitutions del archivo del nodo pisan a las de aca.

substitutions:
  node_name: "unnamed-node"
  friendly_name: "Unnamed Node"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

logger:

# API nativa de ESPHome. Reemplaza a MQTT: HA descubre el nodo solo,
# el canal va cifrado y el OTA viaja por aca mismo. No hace falta broker.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Si no logra conectarse al WiFi, levanta su propio AP para reconfigurarlo
  # sin tener que desmontar el nodo de la pared.
  ap:
    ssid: "${node_name}-fallback"
    password: !secret fallback_password

captive_portal:

# Utilidades de diagnostico: aparecen en HA como entidades del dispositivo.
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
